[package]
name = "dualsense-device"
version = "0.1.0"
edition = "2021"

[dependencies]
dualsense-core = { path = "../dualsense-core" }
hidapi = { version = "2.6.7", features = ["windows-native"] }
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
