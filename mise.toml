[tools]
dotnet = "9"
rust = "1.98"

[tasks."dev:ci"]
description = "Build and test (local merge gate)"
run = ["dotnet build -c Release --nologo", "dotnet test -c Release --no-build --nologo", "cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings", "cargo test --manifest-path rust/Cargo.toml --workspace"]

[tasks."dev:publish"]
description = "Publish a self-contained single-file DualSenseEmu.exe to dist/"
run = "dotnet publish src/DualSenseEmu.Gui -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --nologo -o dist"

[tasks."dev:release"]
description = "Build the installer (releases/DualSenseEmu-win-Setup.exe) and update packages. Usage: mise run dev:release 0.2.0"
usage = 'arg "<version>" help="Release version, e.g. 0.2.0"'
# mise passes the usage arg as $env:usage_version; pwsh so the same syntax works in every step
shell = "pwsh -NoProfile -Command"
run = [
  "if ($env:usage_version -notmatch '^\\d+\\.\\d+\\.\\d+$') { throw 'version must be x.y.z' }",
  "if (Test-Path publish) { Remove-Item publish -Recurse -Force }",
  "dotnet tool restore",
  "dotnet publish src/DualSenseEmu.Gui -c Release -r win-x64 --self-contained true --nologo -o publish -p:Version=$env:usage_version",
  "dotnet vpk pack --packId DualSenseEmu --packVersion $env:usage_version --runtime win-x64 --packDir publish --mainExe DualSenseEmu.exe --packTitle 'DualSense Emulator' --icon src/DualSenseEmu.Gui/Assets/icon.ico --outputDir releases",
]

[tasks."dev:release:rust"]
description = "Build the Rust installer (releases-rust/DualSenseEmu-win-Setup.exe). Same packId as the C# app: publishing it replaces the C# app for existing installs. Usage: mise run dev:release:rust 0.2.0"
usage = 'arg "<version>" help="Release version, e.g. 0.2.0"'
shell = "pwsh -NoProfile -Command"
run = [
  "if ($env:usage_version -notmatch '^\\d+\\.\\d+\\.\\d+$') { throw 'version must be x.y.z' }",
  "if (Test-Path publish-rust) { Remove-Item publish-rust -Recurse -Force }",
  "dotnet tool restore",
  "cargo build --release -p dualsense-gui --manifest-path rust/Cargo.toml",
  "New-Item -ItemType Directory publish-rust | Out-Null",
  "Copy-Item rust/target/release/dualsense-gui.exe publish-rust/DualSenseEmu.exe",
  "dotnet vpk pack --packId DualSenseEmu --packVersion $env:usage_version --runtime win-x64 --packDir publish-rust --mainExe DualSenseEmu.exe --packTitle 'DualSense Emulator' --icon src/DualSenseEmu.Gui/Assets/icon.ico --outputDir releases-rust",
]
