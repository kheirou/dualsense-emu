[tools]
dotnet = "9"

[tasks."dev:ci"]
description = "Build and test (local merge gate)"
run = ["dotnet build -c Release --nologo", "dotnet test -c Release --no-build --nologo"]

[tasks."dev:publish"]
description = "Publish a self-contained single-file DualSenseEmu.exe to dist/"
run = "dotnet publish src/DualSenseEmu.Gui -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --nologo -o dist"

[tasks."dev:release"]
description = "Build the installer (releases/DualSenseEmu-win-Setup.exe) and update packages. Usage: mise run dev:release 0.2.0"
usage = 'arg "<version>" help="Release version, e.g. 0.2.0"'
run = [
  "dotnet tool restore",
  "dotnet publish src/DualSenseEmu.Gui -c Release -r win-x64 --self-contained true --nologo -o publish -p:Version={{arg(name=\"version\")}}",
  "dotnet vpk pack --packId DualSenseEmu --packVersion {{arg(name=\"version\")}} --packDir publish --mainExe DualSenseEmu.exe --packTitle \"DualSense Emulator\" --icon src/DualSenseEmu.Gui/Assets/icon.ico --outputDir releases",
]
